name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: gonewsd
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: gonewsd
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: gonewsd
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            binary_name: gonewsd.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version
        id: version
        run: echo "ver=$(cat VERSION.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # Static Go binaries across targets (where supported by toolchain/OS).
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cp VERSION.txt cmd/gonewsd/resources/VERSION.txt
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/${{ matrix.binary_name }} ./cmd/gonewsd

      - name: Archive binaries
        run: |
          cp gonewsd.conf bin/
          cp README.md bin/
          cp -r manuals bin/
          cp LICENSE bin/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp gonewsdadm.bat bin/
          else
            cp gonewsdadm bin/
          fi
          if [ "${{ matrix.goos }}" = "linux" ] || [ "${{ matrix.goos }}" = "darwin" ]; then
            mkdir -p bin/bootscripts/linux
            cp -r bootscripts/linux/. bin/bootscripts/linux/
          fi
          cd bin
          zip -r ../gonewsd-v${{ steps.version.outputs.ver }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonewsd-v${{ steps.version.outputs.ver }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gonewsd-v${{ steps.version.outputs.ver }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  publish-release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "ver=$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gonewsd-v${{ steps.version.outputs.ver }}-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          files: dist/*.zip
          generate_release_notes: true
