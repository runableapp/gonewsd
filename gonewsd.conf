# gonewsd.conf -- Config file for gonewsd daemon
#                 See manuals/CONFIG-COMPAT.md for directive reference.
#                 By default gonewsd reads /etc/gonewsd.conf; use -c <file> to override.


# ErrorLog: specifies the log file or service.
# Default: stderr
#
#     filename = Append to the named file
#     |program = Pipe log to a program
#     stderr   = Send messages to stderr
#     syslog   = Send messages to syslog
#
#ErrorLog /var/log/gonewsd/error_log
#ErrorLog |logger -f /var/log/gonewsd/error_log
ErrorLog stderr
#ErrorLog syslog

# ErrorLog.Hex: Log non-ASCII remote commands in hex, e.g. <0x##>
# Default: yes
ErrorLog.Hex yes

# HostnameLookups: enable/disable IP address lookups.
# Default: off
#     off    = Don't do lookups
#     on     = Lookup IP address
#     double = Lookup IP and verify name maps back to same IP
#
HostnameLookups off

# Listen: specify listen address and/or port.
# Default: :119
#         Can be host:port, :port, or TCP service name (e.g. nntp).
#
Listen 0.0.0.0:119
#Listen nntp

# LogLevel: type of messages to log.
# Default: info
#
#     error = Errors only
#     info  = Informational and errors
#     debug = Debug, info, and errors
#
LogLevel info

# MaxClients: maximum simultaneous clients; 0 = no limit.
# Default: 0
#
MaxClients 100

# MaxLogSize: max size of log file in bytes before rotation.
# Default: 1m (1048576 bytes)
#             Suffixes k, m, g supported. 0 = disable rotation.
#
MaxLogSize 1m
#MaxLogSize 0

# SendMail: command used when sending email (e.g. mailgateway).
# Default: /usr/sbin/sendmail -t
#
SendMail /usr/sbin/sendmail -t


# ServerName: hostname reported to NNTP clients (e.g. in Path and Xref headers).
# Default: system hostname (from OS), or localhost if that fails.
#
#ServerName news.example.com
ServerName localhost

# SpamFilter: filter program; receives submitted message, return 0 if OK, non-zero if spam.
# Default: (none / disabled)
# Example (SpamAssassin): SpamFilter spamc -c
#
#SpamFilter

# SpoolDir: root directory for newsgroup files and directories.
# Default: /var/spool/gonewsd
#
SpoolDir /var/spool/gonewsd

# Timeout: idle connection timeout in seconds; 0 = disable.
# Default: 43200 (12 hours)
#
Timeout 43200

# User: user account the server runs as (must exist).
# Default: news
#
User news

# Authentication (SQLite-backed multi-user; use gonewsd adduser/addgroup etc.).
#     auth.mode default: public
#     auth.db   default: (empty; auth disabled if unset)
#     auth.log  default: (empty; auth events go to ErrorLog)
#
#     auth.mode = public | private | read_public_write_private
#     auth.db   = path to SQLite auth database (users, groups, group_membership)
#     auth.log  = path for auth event log (optional; empty = use ErrorLog)
#
#auth.mode private
auth.db   /var/lib/gonewsd/auth.db
auth.log  /var/log/gonewsd/auth.log

# PidFile: path where gonewsd writes its PID (for SIGHUP reload from CLI).
# Default: (empty; disabled)
#          Optional; leave unset or "-" to disable. Must be writable by User.
#
PidFile /run/gonewsd/gonewsd.pid

# NoRecurseMsgDir: when on, speeds up LIST by not walking into message dirs for subgroups.
# Default: on
#                  Disable only if groups contain both articles AND subgroups.
#
NoRecurseMsgDir on

# MsgModDirs: when on, store articles in N/ subdirs (e.g. 1000/1234) to avoid huge dirs.
# Default: off
#
MsgModDirs off

# PostCommand: program run after each new article is saved.
# Default: -
#              Arguments appended: groupname, article#, absolute path to article file.
#              Use "-" to disable.
#
PostCommand -
